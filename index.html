<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#101829" />
  <meta name="description" content="A pixel-art courier flight through coast, canyon and orbit." />
  <link rel="icon" href="data:," />
  <title>ASTER // Courier Run</title>
</head>
<body>
<main class="experience" data-label="aria.game">
  <canvas id="screen" data-label="aria.flight"></canvas>
  <canvas id="glow" aria-hidden="true"></canvas>
  <div class="screen-shade" aria-hidden="true"></div>
  <div id="cockpit-display" aria-hidden="true" hidden><canvas id="cockpit-overlay"></canvas></div>
  <div id="safe-area-probe" aria-hidden="true"></div>
  <div id="control-backdrop" aria-hidden="true"></div>
  <header class="hud" data-label="aria.hud">
    <div class="status">
      <div><span data-i18n="hud.hull"></span><b id="hull-bars" class="blocks"></b><small id="lives"></small></div>
      <div><span data-i18n="hud.boost"></span><i class="track"><i id="boost-bar"></i></i></div>
      <div><span data-i18n="hud.bombs" data-tooltip="hud.bombStock"></span><b id="bombs" class="bombs"></b></div>
      <div class="status-view"><strong id="view-label"></strong><span id="weapon-label"></span><time id="segment-timer"></time></div>
    </div>
    <div class="scorebox"><span data-i18n="hud.score"></span><strong id="score"></strong><small id="salvage" data-tooltip="hud.salvage"></small></div>
  </header>
  <button class="touch-pause" id="touch-pause" type="button" data-label="control.pause" hidden>Ⅱ</button>
  <div id="boss-hud" class="boss-hud" hidden><span data-i18n="speaker.warden"></span><i><i id="boss-health"></i></i></div>
  <section id="radio" class="radio" aria-live="polite" hidden>
    <canvas id="portrait" width="32" height="32" aria-hidden="true"></canvas>
    <div><strong id="radio-speaker"></strong><p id="radio-text"></p></div>
  </section>
  <div id="objective" class="objective"></div>
  <div id="boundary-warning" class="boundary-warning" data-i18n="hud.boundary" hidden></div>
  <canvas id="nav-radar" width="72" height="72" data-label="aria.radar"></canvas>
  <div class="alt-ruler" data-label="hud.altitude"><span data-i18n="hud.altitude"></span><i></i><b id="alt-marker">◂</b><small id="alt-number"></small></div>
  <div id="phase-banner" class="phase-banner" hidden></div>
  <div id="view-tag" class="view-tag" hidden></div>
  <section class="game-overlay" id="game-overlay" data-label="aria.menu" hidden>
    <div class="game-card">
      <div class="card-kicker" id="card-kicker"></div>
      <h1 id="card-title"></h1>
      <p id="card-copy"></p>
      <div id="rank-display" class="rank-display" hidden></div>
      <div class="card-actions"><button type="button" id="primary-action"></button><button type="button" id="restart-action" data-i18n="menu.restart" hidden></button></div>
      <div class="card-hint" id="card-hint"></div>
      <div class="card-options" id="card-options" hidden>
        <button class="help-action" id="help-action" type="button"><b aria-hidden="true">?</b><span id="help-action-label"></span></button>
        <div class="language-switch" role="group" data-label="language.label">
          <button type="button" lang="en" data-lang="en" data-i18n="language.en" aria-pressed="false"></button>
          <button type="button" lang="ko" data-lang="ko" data-i18n="language.ko" aria-pressed="false"></button>
        </div>
      </div>
    </div>
    <section class="guide-card" id="guide-card" role="dialog" aria-modal="true" aria-labelledby="guide-heading" hidden>
      <header class="guide-heading"><h2 id="guide-heading" data-i18n="guide.title"></h2></header>
      <div class="guide-body" tabindex="0">
        <section class="guide-pane" id="guide-keyboard">
          <h3 data-i18n="guide.keyboard"></h3>
          <dl class="guide-list">
            <dt data-i18n="guide.move"></dt><dd data-i18n="guide.keysMove"></dd>
            <dt data-i18n="control.fire"></dt><dd data-i18n="guide.keysFire"></dd>
            <dt data-i18n="control.boost"></dt><dd data-i18n="guide.keysBoost"></dd>
            <dt data-i18n="control.bomb"></dt><dd>X</dd>
            <dt data-i18n="control.view"></dt><dd data-i18n="guide.keysView"></dd>
            <dt data-i18n="control.pause"></dt><dd>P</dd>
            <dt data-i18n="guide.start"></dt><dd>Enter</dd>
            <dt data-i18n="guide.mouse"></dt><dd data-i18n="guide.mouseInput"></dd>
          </dl>
        </section>
        <section class="guide-pane" id="guide-touch">
          <h3 data-i18n="guide.touch"></h3>
          <dl class="guide-list">
            <dt data-i18n="guide.stick"></dt><dd data-i18n="guide.touchMove"></dd>
            <dt data-i18n="control.fire"></dt><dd data-i18n="guide.touchFire"></dd>
            <dt data-i18n="control.boost"></dt><dd data-i18n="guide.touchBoost"></dd>
            <dt data-i18n="control.bomb"></dt><dd data-i18n="guide.touchBomb"></dd>
            <dt data-i18n="control.view"></dt><dd data-i18n="guide.touchView"></dd>
            <dt data-i18n="control.pause"></dt><dd data-i18n="guide.touchPause"></dd>
          </dl>
        </section>
        <section class="guide-pane guide-hud">
          <h3 data-i18n="guide.hud"></h3>
          <dl class="guide-list">
            <dt data-i18n="guide.hull"></dt><dd data-i18n="guide.armorHint"></dd>
            <dt data-i18n="guide.bst"></dt><dd data-i18n="guide.boostHint"></dd>
            <dt data-i18n="guide.bmb"></dt><dd data-i18n="guide.bombHint"></dd>
            <dt data-i18n="guide.twin"></dt><dd data-i18n="guide.gunHint"></dd>
            <dt data-i18n="hud.score"></dt><dd data-i18n="guide.scoreHint"></dd>
            <dt class="guide-salvage">◆</dt><dd data-i18n="guide.salvageHint"></dd>
            <dt data-i18n="guide.alt"></dt><dd data-i18n="guide.altitudeHint"></dd>
            <dt data-i18n="guide.radar"></dt><dd data-i18n="guide.radarHint"></dd>
          </dl>
          <p class="guide-markers">
            <span><b>[ ]</b> <span data-i18n="guide.aligned"></span></span>
            <span><b>^</b> <span data-i18n="guide.climb"></span></span>
            <span><b>v</b> <span data-i18n="guide.dive"></span></span>
          </p>
        </section>
      </div>
      <footer class="guide-actions">
        <button id="guide-skip" type="button" data-i18n="guide.skip"></button>
        <button id="guide-primary" type="button"></button>
      </footer>
    </section>
  </section>
  <div class="touch-controls" id="touch-controls" hidden>
    <div class="stick" id="stick" data-label="aria.stick"><span id="stick-knob"></span><small data-i18n="control.climb"></small></div>
    <button class="touch-button fire" id="touch-fire" type="button" data-i18n="control.fire"></button>
    <button class="touch-button boost" id="touch-boost" type="button" data-i18n="control.boost"></button>
    <button class="touch-button bomb" id="touch-bomb" type="button" data-i18n="control.bomb"></button>
    <button class="touch-button view" id="touch-view" type="button" data-i18n="control.view"></button>
  </div>
  <div class="help" id="help" aria-live="polite"></div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
