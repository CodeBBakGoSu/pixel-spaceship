<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101829" />
  <meta name="description" content="A pixel-art courier flight through coast, canyon and orbit." />
  <link rel="icon" href="data:," />
  <title>ASTER // Courier Run</title>
</head>
<body>
<main class="experience" aria-label="Pixel-art courier flight game">
  <canvas id="screen" aria-label="Flight game. Steer, climb and fire."></canvas>
  <canvas id="glow" aria-hidden="true"></canvas>
  <div class="screen-shade" aria-hidden="true"></div>
  <header class="hud" aria-label="Flight status">
    <div class="status">
      <div><span>HULL</span><b id="hull-bars" class="blocks">▮▮▮▮▮▮▮▮</b><small id="lives">×3</small></div>
      <div><span>BST</span><i class="track"><i id="boost-bar"></i></i></div>
      <div><span>BMB</span><b id="bombs" class="bombs">◆◆◆</b></div>
      <div class="status-view"><strong id="view-label">TOP</strong><span id="weapon-label">TWIN 1</span></div>
    </div>
    <div class="scorebox"><span>SCORE</span><strong id="score">000000</strong><small id="salvage">◆ 000</small></div>
  </header>
  <div id="boss-hud" class="boss-hud" hidden><span>WARDEN</span><i><i id="boss-health"></i></i></div>
  <section id="radio" class="radio" aria-live="polite" hidden>
    <canvas id="portrait" width="32" height="32" aria-hidden="true"></canvas>
    <div><strong id="radio-speaker"></strong><p id="radio-text"></p></div>
  </section>
  <div id="objective" class="objective"></div>
  <div class="alt-ruler" aria-label="Altitude"><span>ALT</span><i></i><b id="alt-marker">◂</b><small id="alt-number">110</small></div>
  <div id="phase-banner" class="phase-banner" hidden></div>
  <div id="view-tag" class="view-tag" hidden></div>
  <section class="game-overlay" id="game-overlay" aria-label="Mission menu">
    <div class="game-card">
      <div class="card-kicker" id="card-kicker">COURIER FLIGHT SYSTEMS</div>
      <h1 id="card-title">ASTER <span>WING</span></h1>
      <p id="card-copy">Clear the route. Deliver the signal.</p>
      <div id="rank-display" class="rank-display" hidden></div>
      <div class="card-actions"><button type="button" id="primary-action">LAUNCH MISSION</button><button type="button" id="restart-action" hidden>RESTART</button></div>
      <div class="card-hint" id="card-hint">ENTER TO LAUNCH</div>
    </div>
  </section>
  <div class="touch-controls" id="touch-controls" hidden>
    <div class="stick" id="stick" aria-label="Virtual steering stick"><span id="stick-knob"></span><small>CLIMB / DIVE</small></div>
    <button class="touch-button fire" id="touch-fire" type="button">FIRE</button>
    <button class="touch-button boost" id="touch-boost" type="button">BOOST</button>
    <button class="touch-button bomb" id="touch-bomb" type="button">BOMB</button>
    <button class="touch-button view" id="touch-view" type="button">VIEW</button>
  </div>
  <div class="help" id="help" aria-live="polite"></div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
