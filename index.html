<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#101829" />
  <meta name="description" content="케스트럴 해역에서 펼쳐지는 10분 픽셀 비행 임무. 8:00에 적 에이스가 등장합니다." />
  <title>아스터 윙 | 케스트럴 해역</title>
  <link rel="canonical" href="https://codebbakgosu.github.io/pixel-spaceship/" />
  <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ASTER WING" />
  <meta property="og:title" content="아스터 윙 | 케스트럴 해역" />
  <meta property="og:description" content="케스트럴 해역에서 펼쳐지는 10분 픽셀 비행 임무. 8:00에 적 에이스가 등장합니다." />
  <meta property="og:url" content="https://codebbakgosu.github.io/pixel-spaceship/" />
  <meta property="og:image" content="https://codebbakgosu.github.io/pixel-spaceship/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="ASTER WING 플레이 화면" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="아스터 윙 | 케스트럴 해역" />
  <meta name="twitter:description" content="케스트럴 해역에서 펼쳐지는 10분 픽셀 비행 임무. 8:00에 적 에이스가 등장합니다." />
  <meta name="twitter:image" content="https://codebbakgosu.github.io/pixel-spaceship/og.png" />
</head>
<body>
<main class="experience" data-label="aria.game">
  <canvas id="screen" data-label="aria.flight"></canvas>
  <div id="graphics-recovery" hidden>
    <span id="graphics-status" role="status" data-i18n="graphics.restoring"></span>
  </div>
  <div id="view-wipe" aria-hidden="true" hidden></div>
  <div class="screen-shade" aria-hidden="true"></div>
  <div id="cockpit-display" aria-hidden="true" hidden><canvas id="cockpit-overlay"></canvas></div>
  <div id="reversal-flash" aria-hidden="true"></div>
  <div id="safe-area-probe" aria-hidden="true"></div>
  <div id="control-backdrop" aria-hidden="true"></div>
  <header class="hud" data-label="aria.hud">
    <div class="numeric-hud">
      <div class="hud-readout hud-hull">
        <span class="hud-caption"><strong id="hull-warning" data-i18n="hud.hpLow" hidden></strong><span data-i18n="hud.hp"></span></span>
        <b id="hull-value"></b><span id="hull-bars" class="hud-meter hull-bars" aria-hidden="true"><i id="hull-fill"></i></span>
      </div>
      <div class="hud-readout hud-boost">
        <span class="hud-caption" data-i18n="hud.boostLabel"></span><b id="boost-value"></b>
        <span class="hud-meter" aria-hidden="true"><i id="boost-bar"></i></span>
      </div>
      <div class="hud-readout">
        <span class="hud-caption" data-i18n="hud.speed"></span><b id="speed-value"></b>
      </div>
      <div class="hud-readout">
        <span class="hud-caption" data-i18n="hud.altitude"></span>
        <span class="hud-altitude"><b id="alt-number"></b><small id="alt-band"></small></span>
      </div>
      <div class="hud-readout hud-xp">
        <span id="xp-label" class="hud-caption"></span><b id="xp-value"></b>
        <span class="hud-meter" aria-hidden="true"><i id="xp-bar"></i></span>
      </div>
      <div class="hud-view">
        <span id="view-label"></span><span id="hull-shield" data-i18n="hud.shield" hidden></span>
      </div>
      <div class="hud-clock">
        <strong id="segment-timer"></strong><span id="hud-phase"></span>
        <div class="hud-keys">
          <span id="loop-status" class="hud-key" role="img"><kbd data-i18n="hud.keySpace"></kbd></span>
          <span id="roll-status" class="hud-key" role="img"><kbd data-i18n="hud.keyRoll"></kbd></span>
        </div>
      </div>
    </div>
    <div class="scorebox"><span data-i18n="hud.score"></span><strong id="score"></strong><small id="salvage" data-tooltip="hud.salvage"></small>
      <span id="bill-count" class="bill-count" data-label="menu.summary.bills" data-tooltip="menu.summary.bills" hidden><b></b></span>
    </div>
  </header>
  <aside id="sortie-strip" class="sortie-strip" data-label="stageHud.label" hidden>
    <div class="sortie-clock"><strong id="sortie-phase" hidden></strong><time id="ace-countdown"></time></div>
    <div id="loadout-hud" class="loadout-hud" hidden></div>
  </aside>
  <button class="touch-pause" id="touch-pause" type="button" data-label="control.pause" hidden>Ⅱ</button>
  <button class="audio-toggle" id="audio-toggle" type="button" aria-pressed="false" hidden>
    <span class="speaker-icon" aria-hidden="true"></span>
  </button>
  <div id="boss-hud" class="boss-hud" hidden>
    <span id="ace-label"></span>
    <i id="ace-meter" role="progressbar" data-label="ace.hull" aria-valuemin="0" aria-valuemax="100"><i id="boss-health"></i></i>
  </div>
  <section id="radio" class="radio" aria-live="polite" hidden>
    <canvas id="portrait" width="32" height="32" aria-hidden="true"></canvas>
    <div><strong id="radio-speaker"></strong><p id="radio-text"></p></div>
  </section>
  <div id="objective" class="objective"></div>
  <canvas id="nav-radar" data-label="aria.radar"></canvas>
  <canvas id="arena-map" data-label="aria.arenaMap" hidden></canvas>
  <div class="alt-ruler" data-label="hud.altitude">
    <span data-i18n="hud.altitude"></span>
    <div class="alt-scale" aria-hidden="true"><i></i><small>180</small><small>125</small><small>75</small><small data-i18n="hud.bandSkim"></small><b id="alt-marker">◂</b></div>
  </div>
  <div id="flight-message" class="flight-message" hidden></div>
  <div id="maneuver-cue" class="maneuver-cue" role="status" hidden>
    <strong id="maneuver-name"></strong><span id="maneuver-detail"></span>
  </div>
  <div class="combat-feedback-line">
    <div id="reversal-cue" class="reversal-cue" role="status" hidden></div>
    <div id="kill-counter" class="kill-counter" hidden></div>
  </div>
  <canvas id="damage-feedback" aria-hidden="true"></canvas>
  <div id="scene-cue" class="scene-cue" aria-hidden="true" hidden></div>
  <div id="rear-bomb-marker" class="rear-bomb-marker" aria-hidden="true" hidden>◆↓</div>
  <div id="rear-danger-cue" class="rear-danger-cue" role="status" hidden><span id="rear-position" aria-hidden="true">▼</span><span id="rear-danger-action"></span></div>
  <div id="rear-view-cue" class="rear-view-cue" role="status" hidden></div>
  <samp id="cockpit-delta" class="screen-reader" hidden></samp>
  <div id="view-tag" class="view-tag" hidden></div>
  <div id="phase-banner" class="phase-banner" role="status" hidden></div>
  <div id="gear-toast" class="gear-toast" role="status" hidden>
    <span id="gear-toast-icon" aria-hidden="true"></span>
    <div><strong id="gear-toast-heading"></strong><span id="gear-toast-name"></span></div>
  </div>
  <section class="game-overlay" id="game-overlay" data-label="aria.menu" hidden>
    <div class="game-card">
      <div class="card-kicker" id="card-kicker"></div>
      <h1 id="card-title"></h1>
      <p id="card-copy"></p>
      <div id="rank-display" class="rank-display" hidden></div>
      <div id="run-summary" class="run-summary" hidden></div>
      <div id="checkpoint-prompt" class="checkpoint-prompt" hidden>
        <p id="checkpoint-copy"></p>
        <button type="button" id="checkpoint-resume" data-i18n="checkpoint.resume"></button>
      </div>
      <div class="card-actions"><button type="button" id="primary-action"></button></div>
      <button type="button" id="retreat-action" class="help-action" data-i18n="menu.retreat" hidden></button>
      <div class="card-hint" id="card-hint"></div>
      <div class="card-options" id="card-options" hidden>
        <button class="help-action" id="help-action" type="button"><b aria-hidden="true">?</b><span id="help-action-label"></span></button>
        <div class="language-switch" role="group" data-label="language.label">
          <button type="button" lang="en" data-lang="en" data-i18n="language.en" aria-pressed="false"></button>
          <button type="button" lang="ko" data-lang="ko" data-i18n="language.ko" aria-pressed="false"></button>
        </div>
        <label class="audio-volume">
          <span data-i18n="audio.volume"></span>
          <input id="audio-volume" type="range" min="0" max="100" step="1" value="30" />
        </label>
        <!-- --- S7f lane --- -->
        <div class="render-quality-settings">
          <label><input id="damage-numbers" type="checkbox" checked /> <span id="damage-numbers-label">Damage numbers</span></label>
          <label><input id="cockpit-horizon-lock" type="checkbox" checked /> <span data-i18n="motion.horizonLock"></span></label>
          <label class="shake-slider" for="screen-shake"><span data-i18n="motion.screenShake"></span>
            <input id="screen-shake" type="range" min="0" max="100" step="1" value="50" />
            <output id="screen-shake-value" for="screen-shake">50%</output>
          </label>
          <label for="render-quality" data-i18n="quality.label"></label>
          <select id="render-quality">
            <option value="high" data-i18n="quality.high"></option>
            <option value="medium" data-i18n="quality.medium"></option>
            <option value="low" data-i18n="quality.low"></option>
          </select>
          <span id="render-quality-status" role="status" hidden></span>
        </div>
      </div>
      <div id="hangar-panel" hidden></div>
    </div>
    <section class="game-card draft-card" id="draft-card" role="dialog" aria-modal="true" aria-labelledby="draft-heading" hidden>
      <div class="card-kicker" id="draft-detail"></div>
      <h2 id="draft-heading" data-i18n="draft.title"></h2>
      <div class="draft-options">
        <button type="button" data-pick="0"><kbd>1</kbd><strong></strong><small></small></button>
        <button type="button" data-pick="1"><kbd>2</kbd><strong></strong><small></small></button>
        <button type="button" data-pick="2"><kbd>3</kbd><strong></strong><small></small></button>
      </div>
      <div class="draft-actions" id="draft-actions" hidden>
        <button type="button" id="draft-reroll"></button>
        <button type="button" id="draft-banish" data-i18n="draft.banish" aria-pressed="false"></button>
        <button type="button" id="draft-skip" data-i18n="draft.skip"></button>
      </div>
    </section>
    <section class="game-card chest-card" id="chest-card" role="dialog" aria-modal="true" aria-labelledby="chest-heading" hidden>
      <div class="card-kicker" id="chest-kicker"></div>
      <h2 id="chest-heading"></h2>
      <p id="chest-detail"></p>
      <div class="chest-choices" id="chest-choices"></div>
      <ul class="chest-reels" id="chest-reels" aria-live="polite" hidden></ul>
      <ul class="chest-extra" id="chest-extra" hidden></ul>
      <div class="card-actions">
        <button type="button" id="chest-action"></button>
        <button type="button" id="chest-skip" data-i18n="chest.skip" hidden></button>
      </div>
    </section>
    <section class="guide-card" id="guide-card" role="dialog" aria-modal="true" aria-labelledby="guide-heading" hidden>
      <header class="guide-heading"><h2 id="guide-heading" data-i18n="guide.title"></h2></header>
      <div class="guide-body" tabindex="0">
        <section class="guide-pane" id="guide-keyboard">
          <h3 data-i18n="guide.keyboard"></h3>
          <dl class="guide-list">
            <dt data-i18n="guide.move"></dt><dd data-i18n="guide.keysMove"></dd>
            <dt data-i18n="control.loop"></dt><dd data-i18n="guide.keysLoop"></dd>
            <dt data-i18n="control.roll"></dt><dd data-i18n="guide.keysRoll"></dd>
            <dt data-i18n="control.boost"></dt><dd data-i18n="guide.keysBoost"></dd>
            <dt data-i18n="control.view"></dt><dd data-i18n="guide.keysView"></dd>
            <dt data-i18n="control.pause"></dt><dd>P</dd>
            <dt data-i18n="guide.start"></dt><dd>Enter</dd>
            <dt data-i18n="guide.mouse"></dt><dd data-i18n="guide.mouseInput"></dd>
          </dl>
        </section>
        <section class="guide-pane" id="guide-touch">
          <h3 data-i18n="guide.touch"></h3>
          <dl class="guide-list">
            <dt data-i18n="guide.stick"></dt><dd data-i18n="guide.touchMove"></dd>
            <dt data-i18n="control.loop"></dt><dd data-i18n="guide.touchLoop"></dd>
            <dt data-i18n="control.roll"></dt><dd data-i18n="guide.touchRoll"></dd>
            <dt data-i18n="control.boost"></dt><dd data-i18n="guide.touchBoost"></dd>
            <dt data-i18n="control.view"></dt><dd data-i18n="guide.touchView"></dd>
            <dt data-i18n="control.pause"></dt><dd data-i18n="guide.touchPause"></dd>
          </dl>
        </section>
        <section class="guide-pane guide-hud">
          <h3 data-i18n="guide.hud"></h3>
          <dl class="guide-list">
            <dt data-i18n="hud.bombs"></dt><dd data-i18n="guide.bombHint"></dd>
            <dt data-i18n="control.flare"></dt><dd data-i18n="guide.flareHint"></dd>
            <dt data-i18n="guide.twin"></dt><dd data-i18n="guide.gunHint"></dd>
            <dt class="guide-salvage">◆</dt><dd data-i18n="guide.salvageHint"></dd>
            <dt data-i18n="hud.altitude"></dt><dd data-i18n="guide.skim"></dd>
            <dt data-i18n="aria.radar"></dt><dd data-i18n="guide.radarHint"></dd>
            <dt data-i18n="hud.nav"></dt><dd data-i18n="guide.worldRadar"></dd>
            <dt data-i18n="guide.boss"></dt><dd id="guide-boss-copy"></dd>
          </dl>
          <p class="guide-markers">
            <span><b>△ ^</b> <span data-i18n="guide.climb"></span></span>
            <span><b>■ =</b> <span data-i18n="guide.aligned"></span></span>
            <span><b>▽ v</b> <span data-i18n="guide.dive"></span></span>
          </p>
        </section>
      </div>
      <footer class="guide-actions">
        <button id="guide-skip" type="button" data-i18n="guide.skip"></button>
        <button id="guide-primary" type="button"></button>
      </footer>
    </section>
  </section>
  <div class="touch-controls" id="touch-controls" hidden>
    <div class="stick" id="stick" data-label="aria.stick"><span id="stick-knob"></span><small data-i18n="control.climb"></small></div>
    <button class="touch-button loop" id="touch-loop" type="button" data-i18n="control.loop"></button>
    <button class="touch-button boost" id="touch-boost" type="button" data-i18n="control.boost"></button>
    <button class="touch-button view" id="touch-view" type="button" data-i18n="control.view"></button>
    <button class="touch-button roll" id="touch-roll" type="button" data-i18n="control.roll"></button>
    <div class="touch-threat-cue" id="touch-threat-cue" aria-hidden="true" hidden></div>
    <div class="aegis-volume-cue" id="aegis-volume-cue" role="img" aria-label="" hidden>
      <svg viewBox="0 0 42 40" aria-hidden="true">
        <circle class="aegis-volume-outer" cx="16" cy="20" r="14"></circle>
        <circle class="aegis-volume-inner" id="aegis-volume-cue-inner" cx="16" cy="20" r="8"></circle>
        <path class="aegis-volume-altitude" d="M35 6v28 M31 10l4-4 4 4 M31 30l4 4 4-4"></path>
      </svg>
      <span class="aegis-volume-cue-labels" aria-hidden="true">
        <span id="aegis-volume-cue-radial"></span>
        <span id="aegis-volume-cue-altitude"></span>
      </span>
    </div>
  </div>
  <div class="help" id="help" aria-live="polite"></div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
